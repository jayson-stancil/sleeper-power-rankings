name: Weekly power rankings

on:
  schedule:
    - cron: "0 11 * * 2"   # Tuesdays 11:00 UTC = 6:00 AM ET
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write

env:
  # Fixed, known path for nflreadr's filesystem cache (see R/simulate.R),
  # so the cache step below and rappdirs::user_cache_dir() always agree.
  R_USER_CACHE_DIR: /home/runner/.cache/nflreadr-cache

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Persists downloaded nflverse historical data (base_seasons 2012:2020,
      # used by ffsimulator) across weekly runs. Key has no run-specific
      # suffix so it's reused every week; nflreadr's own 24h memoise timeout
      # handles staleness within a run, restore-keys handles a cold start.
      - name: Cache nflreadr data
        uses: actions/cache@v4
        with:
          path: ${{ env.R_USER_CACHE_DIR }}
          key: nflreadr-cache-${{ runner.os }}-v1
          restore-keys: |
            nflreadr-cache-${{ runner.os }}-

      - name: Install R packages
        run: Rscript -e 'install.packages(c("jsonlite", "PlayerRatings", "gt", "webshot2", "ffscrapr", "ffsimulator"))'

      - name: Run power rankings pipeline
        run: Rscript run_all.R

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly power rankings update [automated]"
          file_pattern: "data/**"
