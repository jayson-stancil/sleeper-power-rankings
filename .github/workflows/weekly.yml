name: Weekly power rankings

on:
  schedule:
    - cron: "0 11 * * 2"   # Tuesdays 11:00 UTC = 6:00 AM ET
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("jsonlite", "PlayerRatings", "gt", "webshot2"))'

      - name: Run power rankings pipeline
        run: Rscript run_all.R

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly power rankings update [automated]"
          file_pattern: "data/**"
